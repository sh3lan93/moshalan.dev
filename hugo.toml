baseURL = "https://moshalan.dev/"
locale = "en"
defaultContentLanguage = "en"
title = "Mohamed Shalan · Senior mobile engineer"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "llms"]

# llms: /llms.txt, a plain-text guide to the site for AI assistants (layouts/home.llms.txt).
# markdown: a clean .md copy of each post at /posts/<slug>/index.md (layouts/single.markdown.md).
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true

# Posts also publish a Markdown copy.
[[cascade]]
  outputs = ["html", "markdown"]
  [cascade.target]
    kind = "page"
    path = "{/posts/**}"

# Tag and category pages stay reachable (tests/baseline-urls.txt) but are thin lists,
# so they are left out of the sitemap and marked noindex.
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade.params]
    robotsNoIndex = true
  [cascade.target]
    kind = "{taxonomy,term}"

# Nav order is part of the brand spec: Writing · Projects · Work with me · About
[menu]
  [[menu.main]]
    identifier = "writing"
    name = "Writing"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    identifier = "work-with-me"
    name = "Work with me"
    url = "/work-with-me/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4

[params]
  env = "production"
  description = "Senior mobile engineer helping teams adopt AI agents safely. AI-readiness audits and agent workflow setup for mobile teams; Android, Kotlin Multiplatform and Flutter."
  keywords = ["Mobile Software Engineering", "Senior Mobile Engineer", "Android Development", "Kotlin", "Kotlin Multiplatform", "Flutter", "AI Agents", "AI-Readiness Audit", "Agentic Workflows", "Mobile CI/CD"]
  author = "Mohamed Shalan"
  # Site-wide share image, used when a page has no cover/images of its own
  images = ["images/og-default.png"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShareButtons = ["x", "linkedin", "reddit"]
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true

  [params.label]
    text = "Mohamed Shalan"

  # Brand values read by the custom homepage and page layouts.
  # Optional brand links: an empty calcomURL or resumePDF hides its button.
  [params.brand]
    positioning = "Senior mobile engineer helping teams adopt AI agents safely."
    email = "mohamed.sh3lan.93@gmail.com"
    linkedin = "https://www.linkedin.com/in/mohamedsh3lan93/"
    github = "https://github.com/sh3lan93"
    calcomURL = "https://cal.com/mohamed-shalan-gwjgvq/15min"
    resumePDF = "/resume.pdf"
    # Appreciate button under each post (https://appreciate-button.com). Public pk_ key,
    # not a secret; its button's allowed origins must list https://moshalan.dev
    # (and http://localhost:1313 for local preview). Empty hides the button.
    appreciateKey = "pk_4c2276e4f7daf3361738763a1bc9ef3a"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sh3lan93"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/mohamedsh3lan93/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:mohamed.sh3lan.93@gmail.com"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    favicon = "app_icon.svg"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "app_icon.svg"
    theme_color = "#ffffff"
    msapplication_TileColor = "#ffffff"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.analytics]
    enable = true
    [params.analytics.posthog]
      # PostHog Project API Key (CI injects POSTHOG_API_KEY by replacing the empty value below)
      apiKey = ""
      host = "https://us.i.posthog.com"
      # When enabled, masks all inputs and text for privacy
      enableSessionRecording = false

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    # Allow HTML in markdown (needed for Mermaid diagrams)
    unsafe = true
